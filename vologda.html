<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вологда // Школа №7</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #000; color: #ccc; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 20; font-size: 11px; font-weight: 700; background: rgba(10,12,20,0.85); padding: 8px 12px; border-radius: 10px; }
    #msg { position: absolute; top: 52px; left: 10px; right: 10px; background: rgba(120,0,0,0.85); color: #fff; padding: 8px; font-size: 12px; border-radius: 8px; z-index: 25; text-align: center; }
    canvas { flex: 1; width: 100%; display: block; background: #080d1a; }
    #controls { height: 130px; background: #080a12; border-top: 1px solid #1a2035; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; }
    .btn { width: 56px; height: 56px; border-radius: 16px; background: #161b2c; border: 1px solid #2d3758; color: #fff; font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .btn-act { width: 56px; height: 56px; border-radius: 16px; background: #1a1e2f; border: 1px solid #3d476e; color: #fff; font-size: 11px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .btn-shoot { width: 64px; height: 64px; border-radius: 50%; background: #b30000; border: 2px solid #ff4d4d; color: #fff; font-size: 12px; font-weight: 900; }
  </style>
</head>
<body>

<div id="hud">
  <span style="color:#79f7ba;">● ВОЛОГДА // ШКОЛА №7</span>
  <span style="color:#f6c445;">🚕 ТАКСИ В АЭРОПОРТ</span>
</div>
<div id="msg">Ты выбрался в заснеженную Вологду! Обойди 7 школу и садись в такси до аэропорта!</div>

<canvas id="c"></canvas>

<div id="controls">
  <div style="display:flex; gap:12px;">
    <button class="btn" id="bL">◀</button>
    <button class="btn" id="bR">▶</button>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <button class="btn-act" id="bJ"><span>▲</span><span>ПРЫЖОК</span></button>
    <button class="btn-act" id="bE" style="color:#f6c445;"><span>🚕</span><span>ТАКСИ</span></button>
    <button class="btn-shoot" id="bS">ОГОНЬ</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 130; }
  window.addEventListener('resize', resize);
  resize();

  const floorY = canvas.height - 40;
  const p = { x: 40, y: floorY - 50, w: 26, h: 50, vx: 0, vy: 0, hp: 100, ammo: 6, facing: 1, grounded: false };
  const keys = { l: false, r: false };

  const enemies = [
    { x: 380, y: floorY - 50, w: 24, h: 50, hp: 2, dir: 1, minX: 280, maxX: 500, alive: true, name: "Даня Гладин (завуч)" },
    { x: 740, y: floorY - 50, w: 24, h: 50, hp: 2, dir: -1, minX: 620, maxX: 880, alive: true, name: "Даня Гладин" }
  ];

  function interact() {
    if (p.x >= 1050) {
      window.location.href = "airport.html";
    }
  }

  function update() {
    p.vx = keys.l ? -3.5 : (keys.r ? 3.5 : 0);
    if (keys.l) p.facing = -1;
    if (keys.r) p.facing = 1;
    p.vy += 0.5; p.x += p.vx; p.y += p.vy;
    if (p.y >= floorY - p.h) { p.y = floorY - p.h; p.vy = 0; p.grounded = true; }
    if (p.x < 10) p.x = 10;

    for (const e of enemies) {
      if (!e.alive) continue;
      e.x += e.dir * 1.4;
      if (e.x <= e.minX || e.x >= e.maxX) e.dir *= -1;
      if (Math.abs(p.x - e.x) < 25 && Math.abs(p.y - e.y) < 35) {
        p.hp -= 0.6;
        if (p.hp <= 0) { alert("Вас настигли в 7 школе!"); location.reload(); }
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const camX = Math.max(0, p.x - canvas.width * 0.35);

    // Снег
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0 - camX, floorY, 1300, 40);

    // 7 школа
    ctx.fillStyle = '#1c2233'; ctx.fillRect(350 - camX, floorY - 140, 240, 140);
    ctx.fillStyle = '#f6c445'; ctx.font = 'bold 12px monospace';
    ctx.fillText("ВОЛОГДА // ШКОЛА № 7", 380 - camX, floorY - 110);

    // Такси в аэропорт
    ctx.fillStyle = '#f59e0b'; ctx.fillRect(1100 - camX, floorY - 45, 65, 45);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace';
    ctx.fillText("🚕 В АЭРОПОРТ", 1080 - camX, floorY - 55);

    // Враги
    for (const e of enemies) {
      if (!e.alive) continue;
      ctx.fillStyle = '#120404'; ctx.fillRect(e.x - camX, e.y, e.w, e.h);
      ctx.fillStyle = '#ff1a1a'; ctx.fillRect(e.x - camX + 4, e.y + 12, 4, 4);
      ctx.fillStyle = '#ff6666'; ctx.font = 'bold 9px monospace';
      ctx.fillText(e.name, e.x - camX - 10, e.y - 6);
    }

    // Игрок
    ctx.save();
    ctx.translate(p.x - camX + p.w / 2, p.y + p.h / 2);
    if (p.facing < 0) ctx.scale(-1, 1);
    ctx.fillStyle = '#111'; ctx.fillRect(-7, -25, 14, 12);
    ctx.fillStyle = '#ffd1b3'; ctx.fillRect(-6, -18, 12, 9);
    ctx.fillStyle = '#121318'; ctx.fillRect(-11, -9, 22, 22);
    ctx.fillStyle = '#1e2438'; ctx.fillRect(-9, 13, 7, 12); ctx.fillRect(2, 13, 7, 12);
    ctx.restore();

    requestAnimationFrame(() => { update(); render(); });
  }

  const bL = document.getElementById('bL'), bR = document.getElementById('bR'), bJ = document.getElementById('bJ');
  bL.ontouchstart = () => keys.l = true; bL.ontouchend = () => keys.l = false;
  bR.ontouchstart = () => keys.r = true; bR.ontouchend = () => keys.r = false;
  bJ.ontouchstart = () => { if (p.grounded) { p.vy = -10.5; p.grounded = false; } };
  document.getElementById('bE').onclick = interact;
  document.getElementById('bS').onclick = () => {
    for (const e of enemies) {
      if (e.alive && Math.abs(e.x - p.x) < 220) { e.alive = false; alert("Даня Гладин уничтожен!"); break; }
    }
  };

  requestAnimationFrame(() => { update(); render(); });
</script>
</body>
</html>
